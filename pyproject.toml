[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wm3d-wam"
version = "0.1.0"
description = "Online VGGT geometry, Wan2.2 video world modeling, and grouped action flow"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "einops>=0.7",
  "hydra-core>=1.3",
  "numpy>=1.24,<2",
  "omegaconf>=2.3",
  "safetensors>=0.4",
  "torch>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

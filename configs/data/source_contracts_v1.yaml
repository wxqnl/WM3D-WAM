        state_semantics: [joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad]
        action_frame: robot_joint_coordinates
        state_frame: robot_joint_coordinates
        composition_operators: [last, last, last, last, last, last, last]
      - name: gripper
        group_id: 32
        action_indices: [7]
        state_indices: [7]
        action_semantics: [absolute_gripper_open01]
        state_semantics: [gripper_open01]
        action_frame: gripper_scalar
        state_frame: gripper_scalar
        composition_operators: [last]
        normalize_action: [false]
        normalize_state: [false]


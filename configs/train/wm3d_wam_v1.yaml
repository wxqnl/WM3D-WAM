runtime:
  permitted_cuda_devices: [1, 2, 3, 4]
  visible_cuda_devices: [1, 2, 3, 4]
  forbidden_cuda_devices: [0, 5, 6, 7]
  nproc_per_node: 4
  precision: bf16
  fsdp: full_shard
  activation_checkpointing: true
  nccl_nvls_enable: 0
  compiler_cache_root: outputs/runtime_cache
  micro_batch_per_gpu: 4
  gradient_accumulation_steps: 1
  effective_global_batch: 16
  exact_local_resume_requires_same_ordered_device_mesh: true

optimizer:
  name: adamw
  betas: [0.9, 0.95]
  max_grad_norm: 1.0
  warmup_steps: 500
  schedule: cosine

checkpoint:
  world_core_storage: canonical_dcp
  full_phase_storage: rank_local_fsdp
  world_core_interval_steps: 500
  full_phase_interval_steps: 500
  keep_last_completed: 3
  estimated_full_checkpoint_gib: 55

stages:
  world_core_pretrain:
    steps: 30000
    checkpoint_interval_steps: 500
    micro_batch_per_gpu: 4
    gradient_accumulation_steps: 1
    effective_global_batch: 16
    k16_memory_canary: passed
    rejected_micro_batch_per_gpu: 8
    program: world_core_pretrain
    family_mix: {oxe: 0.7, robocasa: 0.3}
  wan_action:
    steps: 40000
    checkpoint_interval_steps: 500
    micro_batch_per_gpu: 1
    gradient_accumulation_steps: 1
    effective_global_batch: 4
    rejected_gradient_accumulation_steps: 4
    full_phase_memory_canary: passed
    warmup_steps: 2000
    main_steps: 38000
    program_mix: {action_only: 0.5, forward_world: 0.3, joint_world_action: 0.2}
    parameter_stages:
      warmup: wan_action_warmup
      main: wan_action_main
  tri_stream_alignment:
    steps: 20000
    checkpoint_interval_steps: 500
    micro_batch_per_gpu: 1
    gradient_accumulation_steps: 1
    effective_global_batch: 4
    rejected_gradient_accumulation_steps: 4
    program_mix: {action_only: 0.4, forward_world: 0.3, joint_world_action: 0.3}

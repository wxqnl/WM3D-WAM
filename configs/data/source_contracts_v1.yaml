schema: wm3d_wam_source_contracts_v1
expected_source_count: 21

# ``verified`` means that the local flattened LeRobot payload, not merely the
# upstream dataset name, has enough evidence to assign every trained channel a
# unit/controller space, frame, composition rule, and gripper polarity.
sources:
  - name: oxe_bridge
    source_id: 0
    family: oxe
    embodiment: oxe_bridge_controller
    embodiment_id: 200
    source_hz: 5
    raw_action_dim: 7
    raw_state_dim: 8
    status: verified
    # 5 Hz supplies eight real future observations over 1.6 s. It supervises
    # the corresponding K-grid slots and action-only prediction, but cannot
    # enter Wan video-flow routes that require 17 distinct 10 Hz frames.
    programs: [world_core_pretrain, action_only]
    quality_weight: 0.95
    ignored_action_indices: []
    ignored_state_indices: [6]
    exclusion_reason: ""
    evidence:
      - local LeRobot metadata names XYZ, roll-pitch-yaw, and gripper channels
      - official Bridge controller audit establishes base-frame metric deltas
      - local payload range audit establishes binary open-gripper polarity
    groups:
      - name: eef
        group_id: 31
        action_indices: [0, 1, 2, 3, 4, 5]
        state_indices: [0, 1, 2, 3, 4, 5]
        action_semantics: [delta_position_m, delta_position_m, delta_position_m, delta_rotation_euler_xyz_rad, delta_rotation_euler_xyz_rad, delta_rotation_euler_xyz_rad]
        state_semantics: [eef_position_m, eef_position_m, eef_position_m, eef_rotation_euler_xyz_rad, eef_rotation_euler_xyz_rad, eef_rotation_euler_xyz_rad]
        action_frame: robot_base
        state_frame: robot_base
        composition_operators: [sum, sum, sum, so3_euler_xyz_base_left, so3_euler_xyz_base_left, so3_euler_xyz_base_left]
      - name: gripper
        group_id: 32
        action_indices: [6]
        state_indices: [7]
        action_semantics: [absolute_gripper_open01]
        state_semantics: [gripper_open01]
        action_frame: gripper_scalar
        state_frame: gripper_scalar
        composition_operators: [logical_last]
        normalize_action: [false]
        normalize_state: [false]


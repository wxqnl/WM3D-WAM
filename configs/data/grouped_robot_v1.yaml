schema: wm3d_wam_grouped_robot_v1

window:
  observation_horizon_s: 3.2
  future_horizon_s: 1.6
  world_hz: 10
  future_steps: 16
  video_frames: 17
  vggt_observed_positions: [0, 5, 10, 15]
  vggt_geometry_anchor_indices: [3, 7, 11, 15]
  five_hz_world_valid_indices: [1, 3, 5, 7, 9, 11, 13, 15]
  five_hz_missing_slot_policy: masked_no_repeat_no_interpolation
  maximum_video_pts_error_s: 0.05
  minimum_end_coverage: 0.9

action:
  preserve_source_native_clock: true
  allowed_rates_hz: [5, 10, 15, 20]
  events_per_window:
    5: 8
    10: 16
    15: 24
    20: 32
  padded_capacity_rule: ceil_duration_times_source_hz_plus_one
  max_events: 33
  max_history_events: 65
  max_groups: 8
  max_substeps_per_renderer_interval: 5
  max_action_dim: 16
  max_state_dim: 32
  interpolation: forbidden
  repetition: forbidden
  overflow_policy: reject_window

views:
  roles: [primary_external, secondary_external, wrist]
  target_probabilities: [0.5, 0.25, 0.25]
  spatial_buckets:
    - [256, 256]
    - [192, 256]
    - [160, 288]
